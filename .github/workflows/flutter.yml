name: Calendar CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.4.0', stable]
    defaults:
      run:
        working-directory: packages/general_datetime_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dart pub get
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example
      - run: dart analyze
      - run: dart test
      # Dart 3.4's JS DateTime rounds to milliseconds; precision tests require
      # the current JS backend. The minimum SDK still runs the full VM suite.
      - if: matrix.sdk == 'stable'
        run: dart test --platform node
      - if: matrix.sdk == 'stable'
        run: python ../../tool/validate_chinese_timezones.py --dart dart
      - if: matrix.sdk == 'stable'
        name: Verify Amanta picker dates across local clock changes
        run: |
          for zone in UTC America/Sao_Paulo Pacific/Apia; do
            dart compile js --packages=.dart_tool/package_config.json "-DAMANTA_TEST_TZ=$zone" ../../tool/validate_amanta_picker_timezones.dart -o .dart_tool/amanta-picker.js
            TZ="$zone" node .dart_tool/amanta-picker.js
          done
      - if: matrix.sdk == 'stable'
        run: python ../../tool/test_chinese_validators.py
      - run: dart compile exe example/cli.dart -o .dart_tool/calendar_cli
      - run: .dart_tool/calendar_cli
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.32.0', '']
        timezone: [UTC, Asia/Tehran, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-local-core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
      - name: Resolve checkout dependencies
        run: |
          git rev-parse HEAD
          flutter pub get
          (cd packages/general_datetime_core && dart pub get)
          (cd apps/calendar_demo && flutter pub get)
      - if: matrix.flutter == ''
        run: dart format --output=none --set-exit-if-changed lib test example/lib packages apps/calendar_demo/lib apps/calendar_demo/test apps/calendar_demo/integration_test
      # Flutter 3.50 deprecates the SDK Material and Cupertino APIs.
      # Keep those APIs for Flutter 3.32 and report infos on rolling stable.
      - name: Analyze Flutter package
        run: flutter analyze ${{ matrix.flutter == '' && '--no-fatal-infos' || '' }}
      - run: flutter test --dart-define=CALENDAR_TEST_TZ=${{ matrix.timezone }}
      - name: Analyze calendar demo
        run: flutter analyze ${{ matrix.flutter == '' && '--no-fatal-infos' || '' }}
        working-directory: apps/calendar_demo
      - run: flutter test
        working-directory: apps/calendar_demo
