name: Calendar CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.4.0', stable]
    defaults:
      run:
        working-directory: packages/general_datetime_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example
      - run: dart analyze
      - run: dart test
      - run: dart compile exe example/cli.dart -o .dart_tool/calendar_cli
      - run: .dart_tool/calendar_cli
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.32.0', '']
        timezone: [UTC, Asia/Tehran, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
      - name: Resolve published dependencies
        run: |
          git rev-parse HEAD
          flutter pub get
          (cd packages/general_datetime_core && dart pub get)
          (cd apps/calendar_demo && flutter pub get)
      - if: matrix.flutter == ''
        run: dart format --output=none --set-exit-if-changed lib test example/lib packages apps/calendar_demo/lib apps/calendar_demo/test apps/calendar_demo/integration_test
      - run: flutter analyze
      - run: flutter test --dart-define=CALENDAR_TEST_TZ=${{ matrix.timezone }}
      - run: flutter analyze
        working-directory: apps/calendar_demo
      - run: flutter test
        working-directory: apps/calendar_demo
